name: Update model, Kalshi prices, and website

on:
  schedule:
    - cron: "0 13 * * 2"        # Tue 6am PT: full refresh after Monday night
    - cron: "0 15 * * 4,6,0"    # Thu/Sat/Sun morning: refresh starters and lines
    - cron: "17 */3 * * *"      # every 3 hours: Kalshi price snapshot
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh data and retrain model
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != '17 */3 * * *'
        run: python src/run.py --refresh

      - name: Snapshot Kalshi prices
        continue-on-error: true
        run: python src/kalshi.py

      - name: Commit updated data
        run: |
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data
          git diff --cached --quiet || git commit -m "Update predictions and prices"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

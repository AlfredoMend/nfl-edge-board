name: Update model, Kalshi prices, and website

on:
  schedule:
    # Times are UTC. GitHub drops many runs scheduled near the top of the hour, so these use
    # off-peak minutes and run twice an hour; a dropped run only leaves a ~30 minute gap.
    - cron: "19,49 * * * *"
  workflow_dispatch: {}
  push:                         # redeploy when code or page changes (not data commits)
    branches: [main]
    paths: ["src/**", "site/index.html", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh data and retrain model
        run: python src/run.py --refresh

      - name: Snapshot Kalshi prices
        continue-on-error: true
        run: python src/kalshi.py

      - name: Price Kalshi player props
        continue-on-error: true
        run: python src/kalshi_props.py

      - name: Commit updated data
        run: |
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data
          git diff --cached --quiet || git commit -m "Update predictions and prices"
          git pull --rebase -X theirs -q origin main && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

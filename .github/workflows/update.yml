name: Update model, Kalshi prices, and website

on:
  schedule:
    # Times are UTC. Every run refreshes data (incl. starting QBs), retrains, and checks Kalshi.
    - cron: "7 * * * *"           # every hour, all week
    - cron: "37 16-23 * * 0"      # plus every 30 min Sunday 9am-5pm PT
    - cron: "37 0-5 * * 1,2,5"    # plus every 30 min Sun/Mon/Thu night games PT
  workflow_dispatch: {}
  push:                         # redeploy when code or page changes (not data commits)
    branches: [main]
    paths: ["src/**", "site/index.html", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh data and retrain model
        run: python src/run.py --refresh

      - name: Snapshot Kalshi prices
        continue-on-error: true
        run: python src/kalshi.py

      - name: Discover Kalshi player-prop markets
        continue-on-error: true
        run: python src/kalshi_discover.py

      - name: Commit updated data
        run: |
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data
          git diff --cached --quiet || git commit -m "Update predictions and prices"
          git pull --rebase -q origin main && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
